services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=restaurant'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      # 5432 está ocupada no host; a app via spring-boot-docker-compose
      # continua falando com a porta interna 5432 da rede Docker
      - '5436:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d restaurant']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Profile "full": sobe app + banco.
  # Local com ./mvnw spring-boot:run continua só com o Postgres (sem este profile).
  # Uso: docker compose --profile full up --build
  app:
    profiles: ['full']
    build: .
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/restaurant
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
